name: Feature request
description: An idea to make MAL Reviewer better.
labels: ["Enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: 'The need behind the idea, (ex: "I review a lot of Manga and want to start from my last template").'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could work
      description: What you picture in the app; screenshots or sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought of
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
